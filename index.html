<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apology</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .message {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 10px 20px;
            font-size: 1em;
            border: 1px solid #ccc;
            background-color: #fff;
            cursor: pointer;
            transition: transform 0.3s ease;
        }
        .response {
            display: none;
            font-size: 1.1em;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="message">
            I know I hurt you, and I’m truly sorry.<br>
            I don’t want to justify myself or argue.<br>
            Your feelings matter to me more than my ego.<br>
            Will you forgive me?
        </div>
        <div class="buttons">
            <button id="yes">Yes</button>
            <button id="no">No</button>
        </div>
        <div class="response" id="response">
            Thank you for giving me another chance.<br>
            I promise to listen, improve, and not repeat this.
        </div>
    </div>

    <script>
        const noButton = document.getElementById('no');
        const yesButton = document.getElementById('yes');
        const response = document.getElementById('response');
        const container = document.querySelector('.container');

        // Function to move the "No" button away from the mouse
        function moveNoButtonAway(event) {
            const rect = noButton.getBoundingClientRect();
            const buttonCenterX = rect.left + rect.width / 2;
            const buttonCenterY = rect.top + rect.height / 2;
            const mouseX = event.clientX;
            const mouseY = event.clientY;

            const distance = Math.sqrt((mouseX - buttonCenterX) ** 2 + (mouseY - buttonCenterY) ** 2);
            const threshold = 100; // Distance in pixels to trigger movement

            if (distance < threshold) {
                // Calculate direction away from mouse
                const deltaX = buttonCenterX - mouseX;
                const deltaY = buttonCenterY - mouseY;
                const length = Math.sqrt(deltaX ** 2 + deltaY ** 2);
                const moveDistance = 50; // How far to move

                if (length > 0) {
                    const moveX = (deltaX / length) * moveDistance;
                    const moveY = (deltaY / length) * moveDistance;

                    noButton.style.transform = `translate(${moveX}px, ${moveY}px)`;
                }
            } else {
                // Reset position if mouse is far
                noButton.style.transform = 'translate(0, 0)';
            }
        }

        // Add mousemove listener to the container
        container.addEventListener('mousemove', moveNoButtonAway);

        // Handle "Yes" button click
        yesButton.addEventListener('click', function() {
            document.querySelector('.message').style.display = 'none';
            document.querySelector('.buttons').style.display = 'none';
            response.style.display = 'block';
        });
    </script>
</body>

</html>
